name: Build and verify CarryCode

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Prepare the portable Linux target
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo run --locked --release -p xtask -- prepare
      - run: cargo run --locked --release -p xtask -- build ${{ matrix.target }}
      - name: Smoke test the launchers and upstream binaries
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows-amd64)
              launcher=dist/launchers/windows-amd64/flashGPT.exe
              codex=dist/runtime/bin/windows-amd64/codex/bin/codex.exe
              opencode=dist/runtime/bin/windows-amd64/opencode/opencode.exe
              ;;
            linux-amd64)
              launcher=dist/launchers/linux-amd64/flashgpt
              codex=dist/runtime/bin/linux-amd64/codex/bin/codex
              opencode=dist/runtime/bin/linux-amd64/opencode/opencode
              ;;
          esac
          [[ "$("$launcher" --version)" == "CarryCode "* ]]
          "$codex" --version
          "$opencode" --version
      - name: Preserve Linux executable modes
        if: runner.os == 'Linux'
        run: tar -C dist -cf linux-amd64.tar launchers/linux-amd64 runtime/bin/linux-amd64
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: linux-amd64-verification
          path: linux-amd64.tar
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ matrix.platform }}
          path: dist/launchers/${{ matrix.platform }}/*

  arch:
    runs-on: ubuntu-24.04
    needs: build
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed gcc git rustup tar
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: linux-amd64-verification
      - run: cargo test --locked --workspace
      - name: Verify the same Linux executables on Arch
        shell: bash
        run: |
          set -euo pipefail
          tar -xf linux-amd64.tar
          ./launchers/linux-amd64/flashgpt --version
          ./runtime/bin/linux-amd64/codex/bin/codex --version
          ./runtime/bin/linux-amd64/opencode/opencode --version
          profile="$(mktemp -d)"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CONFIG_HOME="$profile/config"
          export XDG_STATE_HOME="$profile/state"
          export XDG_CACHE_HOME="$profile/cache"
          ./runtime/bin/linux-amd64/opencode/opencode debug paths > "$profile/debug-paths.txt"
          grep -F "$profile/data/opencode/opencode.db" "$profile/debug-paths.txt"

  release:
    runs-on: windows-2025
    needs: [build, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: launcher-windows-amd64
          path: dist/launchers/windows-amd64
      - uses: actions/download-artifact@v7
        with:
          name: launcher-linux-amd64
          path: dist/launchers/linux-amd64
      - run: cargo run --locked --release -p xtask -- prepare
      - run: cargo run --locked --release -p xtask -- package
      - run: cargo run --locked --release -p xtask -- package-lite
      - name: Build Windows setup
        shell: pwsh
        run: ./installer/build.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Verify both uninstallers preserve user data
        shell: pwsh
        run: ./installer/test-uninstall.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/flashgpt-usb-amd64.zip dist/SHA256SUMS
            dist/carrycode-lite-amd64.zip dist/SHA256SUMS-lite
            dist/CarryCode-Lite-Setup-Windows-x64.exe dist/CarryCode-Lite-Setup-Windows-x64.exe.sha256
            dist/CarryCode-Full-Setup-Windows-x64.exe dist/CarryCode-Full-Setup-Windows-x64.exe.sha256
          )
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            fi
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${assets[@]}"
