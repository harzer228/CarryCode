[package]
name = "flashgpt"
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
default-run = "flashgpt"

[dependencies]
age = "0.12.1"
anyhow = "1"
getrandom = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "2.12", features = ["tls"], default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "5"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[workspace]
members = ["xtask"]
resolver = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
